name: Trilium Notes
package: community.lazycat.app.trilium-notes
version: 0.98.1
min_os_version: 1.3.8
description: 一个面向个人和团队的、高度可扩展的私有云盘解决方案，支持 AI 语义搜索。
homepage: https://github.com/TriliumNext/Trilium
author: TriliumNext
application:
    subdomain: trilium-notes
    background_task: true
    public_path:
        - /

    upstreams:
        - location: /
          backend: http://trilium-notes:8080/
services:
    trilium-notes:
        container_name: trilium-notes
        # triliumnext/trilium:v0.98.1
        image: docker.1ms.run/triliumnext/trilium:v0.98.1
        environment:
            - TZ=Asia/Shanghai
            - TRILIUM_DATA_DIR=/home/node/trilium-data
        binds:
            - /lzcapp/var/data:/home/node/trilium-data

locales:
    zh:
        name: "Trilium Notes"
        description: "Trilium Notes 是一款免费且开源、跨平台的阶层式笔记应用程序，专注于建立大型个人知识库。"
    zh_CN:
        name: "Trilium Notes"
        description: "Trilium Notes 是一款免费且开源、跨平台的阶层式笔记应用程序，专注于建立大型个人知识库。"
    en:
        name: "Trilium Notes"
        description: "Trilium Notes is a free and open-source, cross-platform hierarchical note taking application with focus on building large personal knowledge bases."
