version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: trilium-notes

build:
  run_buildscript: false

images:
  - id: trilium-notes
    target: service
    service: trilium-notes
    source: docker.io/triliumnext/trilium
    channel: stable
    sort: semver
    tag_regex: '^v?\d+\.\d+\.\d+$'
    delivery:
      mode: mirror
      image_template: docker.1ms.run/triliumnext/trilium:{tag}
      require_digest_match: true

stores:
  official:
    enabled: false
    skip_if_version_exists: false
    retry:
      enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Trilium Notes
    summary: Published from GitHub Actions
